services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sims
      POSTGRES_PASSWORD: sims_password
      POSTGRES_DB: sims
    volumes:
      - sims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sims -d sims"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sims:sims_password@postgres:5432/sims?schema=public
      CLIENT_URL: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
volumes:
  sims_pgdata:
